server {
    listen 80;
    server_name afervenzatinta.com www.afervenzatinta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name afervenzatinta.com www.afervenzatinta.com;

    ssl_certificate /etc/letsencrypt/live/afervenzatinta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afervenzatinta.com/privkey.pem;

    client_max_body_size 10M;

    root /var/www/html;
    index index.html;

    location / {
        proxy_pass http://asociacion_frontend_prod:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://asociacion_backend_prod:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://asociacion_minio_prod:9000/imagenes/;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }
}