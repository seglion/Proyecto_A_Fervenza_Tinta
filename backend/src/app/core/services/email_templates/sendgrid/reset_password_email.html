<!DOCTYPE html>
<html lang="es">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Restablecer contraseña</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Antonio:wght@700&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
</style>

</head>

<body style="background-color: #0d0d0d; font-family: sans-serif; font-size: 14px; margin: 0; padding: 0;">

<table 
  role="presentation" 
  border="0" 
  cellpadding="0" 
  cellspacing="0" 
  style="width: 100%; max-width: 580px; margin: 0 auto; padding: 24px;"
>
  <tr>
    <td align="center">

      <div 
        style="background-color: #1a1a1a; border-top: 4px solid #dc2626; border-radius: 4px; padding: 30px; color: #ffffff;"
      >
        
        <img 
          src="{{logo_url}}" 
          alt="Logo A Fervenza Tinta" 
          style="width: 80px; display: block; margin: 20px auto;"
        >

        <h1 
          style="font-family: 'Antonio', Arial, sans-serif; color: #dc2626; font-size: 30px; font-weight: bold; text-align: center; margin-top: 0; margin-bottom: 20px;"
        >
          Restablecer contraseña
        </h1>

        <p 
          style="font-family: 'Space Mono', 'Courier New', monospace; color: #e5e5e5; font-size: 16px; line-height: 1.5; margin-bottom: 18px;"
        >
          Hola {{name}},
        </p>

        <p 
          style="font-family: 'Space Mono', 'Courier New', monospace; color: #e5e5e5; font-size: 16px; line-height: 1.5; margin-bottom: 18px;"
        >
          Has solicitado restablecer tu contraseña. Haz clic en el botón para continuar:
        </p>

        <div style="text-align: center; margin: 30px 0;">
          {{button_section}}
          </div>

        <p 
          style="font-family: 'Space Mono', 'Courier New', monospace; color: #e5e5e5; font-size: 16px; line-height: 1.5; margin-bottom: 18px;"
        >
          Si tú no solicitaste este cambio, simplemente ignora este mensaje.
        </p>
      </div>

      <div 
        style="text-align: center; color: #999999; font-size: 12px; margin-top: 20px; font-family: 'Space Mono', 'Courier New', monospace;"
      >
        Asociación Cultural A Fervenza Tinta<br>
        © {{year}} — Todos los derechos reservados
      </div>

    </td>
  </tr>
</table>

</body>
</html>
