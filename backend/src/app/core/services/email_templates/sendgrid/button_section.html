<table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto;">
  <tr>
    <td
      align="center"
      style="background-color: #dc2626; border-radius: 5px;"
    >
      <a
        href="{{link}}"
        target="_blank"
        style="
          display: inline-block;
          padding: 14px 28px;
          font-family: 'Space Mono', 'Courier New', monospace;
          font-size: 16px;
          font-weight: bold;
          color: #ffffff;
          text-decoration: none;
          border-radius: 5px;
        "
      >
        {{button_text}}
      </a>
    </td>
  </tr>
</table>
