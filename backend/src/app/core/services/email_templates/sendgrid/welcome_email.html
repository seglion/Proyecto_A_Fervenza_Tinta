<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>Bienvenido/a</title>

<style>
    body {
        background-color: #000000;
        font-family: sans-serif;
        font-size: 14px;
        margin: 0;
        padding: 0;
    }

    table {
        border-collapse: separate;
        width: 100%;
    }

    .container {
        margin: 0 auto;
        max-width: 580px;
        width: 100%;
        padding-top: 24px;
    }

    .content {
        width: 100%;
        box-sizing: border-box;
    }

    .main {
        background: #FFFFFF;
        border-radius: 4px;
        width: 100%;
    }

    .wrapper {
        padding: 24px;
    }

    .header-band {
        background-color: #C8102E;
        height: 8px;
        width: 100%;
        display: block;
    }

    h1 {
        color: #C8102E;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 18px;
    }

    p {
        color: #333333;
        margin-bottom: 18px;
    }

    .btn table {
        width: auto;
        margin: 0 auto;
    }

    .btn-primary a {
        background-color: #C8102E;
        border-radius: 5px;
        color: #FFFFFF;
        display: inline-block;
        font-weight: bold;
        padding: 12px 24px;
        text-decoration: none;
        text-transform: none;
        font-size: 14px;
    }

    .footer {
        text-align: center;
        padding-top: 24px;
        color: #CCCCCC;
        font-size: 11px;
    }
</style>
</head>

<body>

<span class="header-band"></span>

<table role="presentation" class="container">
<tr>
<td>

    <table role="presentation" class="content">
        <tr>
            <td class="main">

                <div class="wrapper">
                    <h1>Bienvenido/a</h1>

                    <p>Hola {{name}},</p>

                    <p>
                        Bienvenido/a a nuestra plataforma. Gracias por unirte.
                    </p>

                    {{button_section}}

                    <p>
                        Si necesitas ayuda, estamos para apoyarte. Avanza con confianza.
                    </p>
                </div>
            </td>
        </tr>
    </table>

    <div class="footer">
        Asociación Cultural A Fervenza Tinta<br>
        © {{year}} — Todos los derechos reservados
    </div>

</td>
</tr>
</table>

</body>
</html>
